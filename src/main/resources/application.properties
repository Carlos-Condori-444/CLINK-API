# ============================================================
# Configuración del servidor
# ============================================================
server.port=8080
spring.application.name=clink-api

# ============================================================
# Configuración de PostgreSQL
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/clink_db
#spring.datasource.username=clink_user
#spring.datasource.password=clink_password_2026
spring.datasource.username={DB_USERNAME}
spring.datasource.password={DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# Configuración de JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================================
# Configuración de Jackson (para fechas)
# ============================================================
#spring.jackson.serialization.write-dates-as-timestamps=true
spring.jackson.time-zone=America/Lima

# ============================================================
# Configuración de logs (opcional)
# ============================================================
logging.level.pe.edu.utp.clink.api=DEBUG
logging.level.org.springframework.security=DEBUG

# ============================================================
# Configuración JWT
# ============================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.profiles.active=local